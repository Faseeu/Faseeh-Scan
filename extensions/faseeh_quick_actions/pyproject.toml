[project]
name = "faseeh-quick-actions"
version = "0.1.0"
description = "Faseeh Scan Flet extension: home-screen quick action shortcut to scan."
requires-python = ">=3.10"
dependencies = ["flet>=0.86"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["faseeh_quick_actions"]

[tool.flet.extension]
flutter_path = "src/flutter/faseeh_quick_actions"
