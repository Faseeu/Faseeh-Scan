name: faseeh_quick_actions
description: Home-screen quick action (long-press app icon -> Scan document).
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  flet: ^0.86.0
  quick_actions: ^1.0.7

flutter:
  plugin:
    platforms:
      android:
        package: com.faseeh.scan.quickactions
        pluginClass: FaseehQuickActionsPlugin
      ios:
        pluginClass: FaseehQuickActionsPlugin
