[project]
name = "faseeh-local-auth"
version = "0.1.0"
description = "Faseeh Scan Flet extension: biometric unlock via local_auth (fingerprint/face)."
requires-python = ">=3.10"
dependencies = ["flet>=0.86"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["faseeh_local_auth"]

[tool.flet.extension]
flutter_path = "src/flutter/faseeh_local_auth"
