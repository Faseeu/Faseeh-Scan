name: faseeh_scan_mlkit
description: Faseeh Scan Flet extension wrapping Google ML Kit Document Scanner.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  flet: ^0.86.0
  google_mlkit_document_scanner: ^0.5.0

flutter:
  plugin:
    platforms:
      android:
        package: com.faseeh.scan.mlkit
        pluginClass: FaseehScanMlkitPlugin
