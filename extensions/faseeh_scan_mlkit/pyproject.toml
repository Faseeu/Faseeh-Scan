[project]
name = "faseeh-scan-mlkit"
version = "0.1.0"
description = "Faseeh Scan Flet extension wrapping Google ML Kit Document Scanner (Android)."
requires-python = ">=3.10"
dependencies = [
    "flet>=0.86",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["faseeh_scan_mlkit"]

[tool.flet.extension]
# Tells the Flet build where the Flutter part lives.
flutter_path = "src/flutter/faseeh_scan_mlkit"
